name: Tagged Android builds

# Builds, verifies and publishes a tagged release through the shared app release workflow
# (shared/docs/android-build.md); a manual run builds and verifies without publishing.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name for a manual build'
        required: true
        default: '0.1.0-ci'

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
      actions: write
    # Pinned to the shared commit this repository's shared submodule names.
    uses: MrJackSpade/Kairo/.github/workflows/app-release.yml@916e40b0149ac1c979299a6cb9974f3bcd99cb22
    with:
      module: kairo64
      name: Kairo64
      package: com.loxifi.kairo64
      version: ${{ inputs.version || '0.1.0-ci' }}
    secrets: inherit
